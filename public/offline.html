<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f6f8; --card: #ffffff; --ink: #14181f; --muted: #5b6573; --brand: #2f8dff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1017; --card: #141b25; --ink: #f1f4f8; --muted: #9aa6b6; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 380px; padding: 28px 24px; border-radius: 20px; background: var(--card); text-align: center; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12); }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; font-size: 15px; line-height: 1.45; color: var(--muted); }
      button { width: 100%; padding: 14px 16px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Gamonal Driver necesita internet para abrirse. Revisa tu conexión y vuelve a intentarlo.</p>
      <button type="button" onclick="location.href = 'https://app-gamonal-trasporti-front.vercel.app/'">Reintentar</button>
    </main>
  </body>
</html>

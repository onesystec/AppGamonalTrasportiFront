# Compila el APK de Android y lo publica para que los testers lo bajen desde la app (Ajustes > Acerca de > Actualizar aplicacion).
#
# Solo corre cuando cambia algo NATIVO (carpeta android/ o capacitor.config.json). Los cambios de la parte web (pantallas, colores, textos)
# no necesitan APK nuevo: la app carga la web desde Vercel (ver server.url en capacitor.config.json) y los ve en cuanto Vercel publica.
#
# Secretos necesarios (GitHub > Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  la clave de firma (base64 de ~/.android/debug.keystore): la MISMA con la que se firmo el APK que ya tienen los
#                            testers, si no Android no deja actualizar encima.
#   APP_PUBLISH_TOKEN        la clave del servidor para publicar (misma que la variable APP_PUBLISH_TOKEN de Render).
name: APK de Android

on:
  push:
    branches: [main, Maudev]
    paths:
      - "android/**"
      - "capacitor.config.json"
  workflow_dispatch:
    inputs:
      notas:
        description: "Que hay de nuevo (lo ven los testers)"
        required: false

concurrency:
  group: android-apk
  cancel-in-progress: false

env:
  API_URL: https://appgamonaltrasportiback-vv19.onrender.com/api

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Comprobar secretos
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TOKEN: ${{ secrets.APP_PUBLISH_TOKEN }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$TOKEN" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y/o APP_PUBLISH_TOKEN (ver el comentario al inicio de este archivo)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar la web y sincronizar con Android
        run: |
          VITE_API_URL="$API_URL" pnpm exec vite build
          pnpm exec cap sync android

      - name: Poner la clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore

      - name: Compilar el APK
        working-directory: android
        run: |
          # El numero de version sube solo con cada corrida: Android solo actualiza a un versionCode mayor.
          export APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 10))
          export APP_VERSION_NAME="1.2.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Firma del APK (comparar con la de tu clave)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar para los testers
        env:
          TOKEN: ${{ secrets.APP_PUBLISH_TOKEN }}
          NOTAS_MANUAL: ${{ github.event.inputs.notas }}
        run: |
          NOTAS="${NOTAS_MANUAL:-$(git log -1 --pretty=%s)}"
          NOTAS_URL=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$NOTAS")
          # El servidor gratuito de Render puede estar dormido: se reintenta unos minutos hasta que despierte.
          curl --fail-with-body --silent --show-error \
            --retry 8 --retry-delay 20 --max-time 600 \
            -X POST "$API_URL/app/android/publicar" \
            -H "x-publish-token: $TOKEN" \
            -H "x-version-code: $VERSION_CODE" \
            -H "x-version-name: $VERSION_NAME" \
            -H "x-notas: $NOTAS_URL" \
            -H "content-type: application/vnd.android.package-archive" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk
          echo
          echo "Publicada la version $VERSION_NAME ($VERSION_CODE)"
